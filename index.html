<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Keeper of Forgotten Stories
</title>

<link
    rel="stylesheet"
    href="css/main.css"
>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

</head>
<script src="js/supabase.js"></script>

<script src="data/stories.js"></script>

<script src="js/comments.js"></script>

<script src="js/stories.js"></script>

<script src="js/main.js"></script>

</body>

</html>
<body>

<div id="stars"></div>

<div id="petals"></div>


<header>

    <div class="moon"></div>

    <div class="header-content">

        <div class="flower">
            𑁍
        </div>

        <h1>
            Keeper of Forgotten Stories
        </h1>

        <p>
            Onde histórias esquecidas
            continuam florescendo.
        </p>

    </div>

</header>


<nav>

    <button>
        Início
    </button>

    <button>
        Histórias
    </button>

    <button>
        Comunidade
    </button>

    <button>
        Sobre
    </button>

</nav>


<main>

    <section id="library">

        <h2>
            Biblioteca
        </h2>

        <div id="storyGrid"></div>

    </section>


    <section id="community">

        <h2>
            Comunidade
        </h2>

        <div id="discussionList"></div>

    </section>


    <section id="about">

        <h2>
            Sobre a Keeper
        </h2>

        <p>
            ...
        </p>

    </section>

</main>


<footer>

    <div>
        𑁍
    </div>

    <p>
        The archive remains open.
    </p>

</footer>

<div
    id="storyModal"
    class="modal"
>

    <div class="modal-content">

        <button
            onclick="closeStory()"
        >
            X
        </button>


        <span
            id="modalStatus"
            class="story-status"
        ></span>


        <h2
            id="modalTitle"
        ></h2>


        <p
            id="modalDescription"
        ></p>


        <div class="comments-section">

            <h3>
                Comentários
            </h3>


            <input
                id="commentName"
                type="text"
                maxlength="50"
                placeholder="Seu nome ou pseudônimo"
            >


            <textarea
                id="commentText"
                maxlength="2000"
                placeholder="Escreva seu comentário..."
            ></textarea>


            <button
                onclick="sendComment()"
            >
                Publicar comentário
            </button>


            <div
                id="comments"
            ></div>

        </div>

    </div>

</div>
    
<script src="js/supabase.js"></script>

<script src="data/stories.js"></script>

<script src="js/comments.js"></script>

<script src="js/stories.js"></script>

<script src="js/main.js"></script>

</body>
